name: CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag'
        required: false
        type: string

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Build and push Docker images
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Optional: Add Docker Hub login if secrets are configured
      # - name: Login to Docker Hub
      #   uses: docker/login-action@v3
      #   with:
      #     username: ${{ secrets.DOCKER_HUB_USERNAME }}
      #     password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Extract metadata for Docker images
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ github.repository }}-backend
            ${{ env.REGISTRY }}/${{ github.repository }}-frontend
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./SpringAIDemo
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}-backend:latest
            ${{ env.REGISTRY }}/${{ github.repository }}-backend:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}-frontend:latest
            ${{ env.REGISTRY }}/${{ github.repository }}-frontend:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Docker Compose development file
        run: |
          cat > docker-compose.github-actions.yml << EOF
          version: '3.8'
          
          services:
            backend:
              image: ${{ env.REGISTRY }}/${{ github.repository }}-backend:${{ github.sha }}
              container_name: spring-ai-backend
              ports:
                - "8080:8080"
              environment:
                - SPRING_AI_GEMINI_API_KEY=\${SPRING_AI_GEMINI_API_KEY}
                - SPRING_AI_GEMINI_API_ENDPOINT=\${SPRING_AI_GEMINI_API_ENDPOINT}
              restart: unless-stopped
            
            frontend:
              image: ${{ env.REGISTRY }}/${{ github.repository }}-frontend:${{ github.sha }}
              container_name: spring-ai-frontend
              ports:
                - "80:80"
                - "443:443"
              depends_on:
                - backend
              restart: unless-stopped
          EOF

      - name: Upload docker-compose file
        uses: actions/upload-artifact@v4
        with:
          name: docker-compose-github-actions
          path: docker-compose.github-actions.yml

  # Create GitHub Release
  release:
    name: Create GitHub Release
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release version
        id: version
        run: |
          if [ "${{ github.event.inputs.version }}" != "" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=$(git describe --tags --abbrev=0 2>/dev/null || echo 'v1.0.0')" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.version }}
          release_name: Release ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false

  # Deploy to Kubernetes (placeholder)
  deploy-kubernetes:
    name: Deploy to Kubernetes
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Kubernetes
        run: |
          echo "Deploying to Kubernetes..."
          echo "This is a placeholder for Kubernetes deployment."
          echo "To enable Kubernetes deployment:"
          echo "1. Add KUBECONFIG secret to your repository"
          echo "2. Add your Kubernetes manifests to k8s/ directory"
          echo "3. Uncomment and configure the deployment steps below"
          
          # Uncomment these lines to enable actual deployment:
          # - name: Set up kubectl
          #   uses: azure/k8s-set-context@v1
          #   with:
          #     kubeconfig: ${{ secrets.KUBECONFIG }}
          #
          # - name: Deploy backend
          #   run: kubectl apply -f k8s/backend-deployment.yml
          #
          # - name: Deploy frontend
          #   run: kubectl apply -f k8s/frontend-deployment.yml

  # Notify deployment (placeholder for other platforms)
  notify:
    name: Notify Deployment
    needs: build-and-push
    runs-on: ubuntu-latest
    
    steps:
      - name: Success notification
        run: |
          echo "Deployment completed successfully!"
          echo "Docker images pushed to:"
          echo "  - ${{ env.REGISTRY }}/${{ github.repository }}-backend:${{ github.sha }}"
          echo "  - ${{ env.REGISTRY }}/${{ github.repository }}-frontend:${{ github.sha }}"
          echo ""
          echo "To deploy manually, use:"
          echo "  docker compose -f docker-compose.github-actions.yml up -d"
