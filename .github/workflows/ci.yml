name: CI Pipeline

on:
  push:
    branches: [ main, develop, "**" ]
  pull_request:
    branches: [ main, develop ]

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '20'

jobs:
  # Build and test Spring Boot Backend
  backend-build:
    name: Build Spring Boot Backend
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Spring Boot application
        working-directory: SpringAIDemo
        run: ./mvnw clean compile -DskipTests

      - name: Run backend tests
        working-directory: SpringAIDemo
        run: ./mvnw test -Dspring.profiles.active=test
        env:
          SPRING_AI_GEMINI_API_KEY: dummy-key-for-ci
          SPRING_AI_GEMINI_API_ENDPOINT: https://generativelanguage.googleapis.com/v1

      - name: Upload backend test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-reports
          path: SpringAIDemo/target/surefire-reports/
          retention-days: 7

      - name: Upload backend test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Backend Tests
          path: SpringAIDemo/target/surefire-reports
          reporter: java-junit

  # Build and test React Frontend
  frontend-build:
    name: Build React Frontend
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint || true

      - name: Run frontend tests
        run: npm run test -- --coverage --watchAll=false
        env:
          CI: true
          VITE_API_URL: http://localhost:8080

      - name: Build frontend
        run: npm run build

      - name: Upload frontend test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-test-reports
          path: frontend/coverage/
          retention-days: 7

      - name: Upload frontend build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist/
          retention-days: 7

  # Security checks
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Run SpotBugs
        working-directory: SpringAIDemo
        run: ./mvnw spotbugs:check -DskipTests || true

      - name: Run OWASP Dependency Check
        working-directory: SpringAIDemo
        run: ./mvnw org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=7 || true
        env:
          SPRING_AI_GEMINI_API_KEY: dummy-key

  # Build Docker images (optional verification)
  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        working-directory: SpringAIDemo
        run: docker build -t spring-ai-demo-backend:${{ github.sha }} .

      - name: Build frontend Docker image
        working-directory: frontend
        run: docker build -t spring-ai-demo-frontend:${{ github.sha }} .

      - name: Test Docker Compose
        run: |
          docker compose -f docker-compose.yml up -d --build
          sleep 30
          docker compose -f docker-compose.yml ps
          docker compose -f docker-compose.yml down
