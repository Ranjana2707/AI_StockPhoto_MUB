# Spring AI Demo - Application Properties

# Application Name
spring.application.name=AI Chat Assistant

# Server Configuration
server.port=8080

# Gemini API Configuration
# IMPORTANT: Use application-local.properties or environment variable for API key
# Do NOT commit your actual API key to version control!
# Option 1: Use environment variable (recommended for production)
#   export GEMINI_API_KEY=your_api_key_here
# Option 2: Create application-local.properties (add to .gitignore)
#   gemini.api.key=your_api_key_here
gemini.api.key=${GEMINI_API_KEY:YOUR_API_KEY_HERE}

# Logging Configuration
logging.level.root=INFO
logging.level.com.Ai.SpringAIDemo=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# CORS Configuration (configured in CorsConfig.java)
# Allowed origins are defined in CorsConfig

# Server Error Message
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never
server.error.include-exception=false
